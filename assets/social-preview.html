<!doctype html>
<!--
  The source of assets/social-preview.png, the 1280x640 card that GitHub and the
  project page show when a link to UDM is shared. Render it with headless Chrome
  from the repository's root:

    google-chrome --headless --hide-scrollbars --window-size=1280,640 \
      --screenshot=assets/social-preview.png assets/social-preview.html

  Then upload the PNG in the repository's Settings > General > Social preview.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 52px; padding: 0 72px; box-sizing: border-box;
    background: linear-gradient(135deg, #0f2747 0%, #1d4f8f 60%, #2a78d6 100%);
    color: #ffffff;
    font-family: system-ui, "Segoe UI", Roboto, Ubuntu, "Noto Sans", sans-serif;
  }
  img { width: 280px; height: 280px; flex: none; filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.35)); }
  h1 { font-size: 104px; line-height: 1; margin: 0 0 20px; letter-spacing: -2px; }
  p { margin: 0; }
  .tag { font-size: 35px; line-height: 1.3; font-weight: 600; white-space: nowrap; }
  .sub { margin-top: 28px; font-size: 27px; color: #cfe1f7; white-space: nowrap; }
  .free { color: #7be08f; }
</style>
</head>
<body>
  <img src="icon-1024.png" alt="">
  <div>
    <h1>UDM</h1>
    <p class="tag">The download manager you know from IDM.<br>On Windows, macOS and Linux. <span class="free">Free.</span></p>
    <p class="sub">Open source · 16 connections · resume · video</p>
  </div>
</body>
</html>
