    <line x1="28" y1="256" x2="472" y2="256" stroke="#2a3646" stroke-width="1.5"/>
    <text x="28" y="286" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" fill="#93a1b2">resumes after a crash or a restart</text>
