[workspace]
resolver = "2"
# The layers of AGENTS.md. Dependencies point inward: domain <- application
# <- infrastructure and ui <- app. The code still lives mostly in
# infrastructure (the old `pullbay` library) and app (the three binaries);
# AGENTS.md section 16 tracks the moves still to make.
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/ui", "crates/app"]

# The release scripts read the first `version = ` line of this file.
[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
pullbay-domain = { path = "crates/domain" }
pullbay-application = { path = "crates/application" }
pullbay-infrastructure = { path = "crates/infrastructure" }
pullbay-ui = { path = "crates/ui" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Each layer's error enum (AGENTS.md section 9). Already in Cargo.lock
# through reqwest, so it adds no new download.
thiserror = "2.0.21"
# The binaries' startup errors, with what was being done (AGENTS.md
# section 9: app only).
anyhow = "1"
# Log events (AGENTS.md section 11), for infrastructure and app only. Just
# the event macros, without #[instrument] and its proc macro. Already in
# Cargo.lock through reqwest.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
url = "2"
base64 = "0.22"
percent-encoding = "2"
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_System_Com",
    # SHDoDragDrop: dragging a finished file out of the window.
    "Win32_System_Ole",
    "Win32_System_WinRT",
    # ITaskbarList: the window's taskbar button while it is in the tray.
    "Win32_UI_Shell",
] }

[profile.release]
strip = true

# AGENTS.md section 9: no unwrap, expect or panic outside tests. Warnings,
# which the quality gate's `-D warnings` turns into errors. clippy.toml lets
# tests unwrap, expect and panic; a documented invariant takes a local
# `#[allow(clippy::expect_used)]` next to the comment that states it. Each
# crate opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
