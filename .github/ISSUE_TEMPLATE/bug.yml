name: Bug report
description: Something in UDM doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check [Known gaps](https://github.com/tajbinkhan/pullbay/blob/main/docs/known-gaps.md) first, and use the crash form if a UDM program closed by itself.
  - type: input
    id: version
    attributes:
      label: UDM version
      description: In the window, Help > About UDM.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: system-details
    attributes:
      label: System details
      description: The version, and on Linux the distribution, desktop, and X11 or Wayland.
      placeholder: "Ubuntu 24.04, GNOME, Wayland"
  - type: dropdown
    id: install
    attributes:
      label: How you installed UDM
      options:
        - Setup (UDM-Setup .exe)
        - Windows portable zip
        - macOS .dmg
        - .deb package
        - .rpm package
        - AppImage
        - .tar.gz with install.sh
        - Built from source
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: If the problem involves the browser or the extension, which browser and version.
      placeholder: "Chrome 142"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can, include a download address that shows the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The end of `udm-daemon.log`, `udm-gui.log` or `udm-host.log` from the data folder: `%LOCALAPPDATA%\UDM` on Windows, `~/Library/Application Support/UDM` on macOS, `~/.local/share/udm` on Linux (a portable copy keeps them in its `Data` folder). The logs show download addresses, so look them over before you paste.
      render: text
