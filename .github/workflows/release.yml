# Builds UDM's installers for every system and attaches them to a GitHub
# Release. Release files don't count against the repository's storage, and
# UDM's own update check reads the latest release.
#
# To release: set the version in Cargo.toml, write the notes in
# release-notes/v<version>.md (start from release-notes/TEMPLATE.md), commit,
# then push a tag that matches it:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Started by hand (Actions > Release > Run workflow), it builds the same
# files without publishing them, as artifacts kept for a day. The `docker`
# job also pushes the server image to GitHub Container Registry for a tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "The tag ${{ github.ref_name }} does not match version $version in Cargo.toml" }

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      # AGENTS.md section 13: the shell embeds the built frontend, so it is
      # built before Cargo runs.
      - name: Build the frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Build
        run: cargo build --release --locked

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "could not install Inno Setup" }
          }

      - name: Build the installer
        shell: pwsh
        run: .\installer\windows\build.ps1 -SkipBuild

      # Pullbay 0.4's Update now only takes a Setup named Pullbay-Setup-*.exe.
      # The same Setup under that name lets it update to UDM (installer\windows\udm.iss
      # takes its /frompullbay=yes).
      - name: Name a copy of the installer for Pullbay
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Copy-Item "dist\UDM-Setup-$version.exe" "dist\Pullbay-Setup-$version.exe"

      - name: Make the portable zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $out = "dist\portable\UDM"
          New-Item -ItemType Directory -Force "$out\target\release" | Out-Null
          Copy-Item target\release\udm-host.exe, target\release\udm-daemon.exe, target\release\udm-gui.exe, target\release\udm-cli.exe, target\release\udm-mcp.exe "$out\target\release"
          # Only a windows-gnu build has it, and needs it (installer\windows\udm.iss).
          if (Test-Path target\release\WebView2Loader.dll) { Copy-Item target\release\WebView2Loader.dll "$out\target\release" }
          # The copy keeps the folder names extension and firefox, as Setup
          # does; build.ps1 checked the Firefox copy above.
          Copy-Item -Recurse extension\chromium "$out\extension"
          Copy-Item -Recurse extension\firefox "$out\firefox"
          Copy-Item -Recurse host "$out"
          Copy-Item install-host.ps1, README.md "$out"
          # The marker makes the zip a portable copy (docs/portable.md).
          Copy-Item installer\windows\portable.txt "$out"
          Compress-Archive -Path $out -DestinationPath "dist\UDM-$version-windows-portable.zip"
          Remove-Item -Recurse -Force dist\portable

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      # AGENTS.md section 13: the shell embeds the built frontend, so it is
      # built before Cargo runs.
      - name: Build the frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Build the disk image
        run: installer/macos/package.sh

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  linux:
    name: Linux
    # The oldest supported Ubuntu, so the programs run on every newer system.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install the build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev rpm libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      # AGENTS.md section 13: the shell embeds the built frontend, so it is
      # built before Cargo runs.
      - name: Build the frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Build the packages
        run: installer/linux/package.sh

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  # The server image (Dockerfile, docs/server.md), pushed to GitHub
  # Container Registry as ghcr.io/<owner>/udm with the version's tags and
  # latest. It waits for the installers so a release that fails to build
  # publishes no image; started by hand, it is built but not pushed. Only
  # linux/amd64: an arm64 build under emulation takes too long here.
  docker:
    name: Docker image
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # v0.5.0 is tagged 0.5.0, 0.5 and latest; a pre-release only with its
      # own version.
      - name: Name the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/udm
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the notes, the signing script and the pinned public key are
      # read; gh uses GH_TOKEN, so git keeps no token.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Update now installs only files this signed list names (#267,
      # docs/install.md). UDM_RELEASE_KEY is the line that
      # `node installer/sign-checksums.js keygen` wrote; without it the
      # release fails here rather than publishing files Update now refuses.
      # The check uses the public key UDM pins.
      - name: Sign the checksums
        env:
          UDM_RELEASE_KEY: ${{ secrets.UDM_RELEASE_KEY }}
        run: |
          node installer/sign-checksums.js sign dist
          node installer/sign-checksums.js verify dist crates/infrastructure/src/release-key.pub
          cat dist/SHA256SUMS

      # The notes come from release-notes/<tag>.md. Without that file the
      # release gets GitHub's list of merged pull requests instead.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          notes="release-notes/$TAG.md"
          if [ -f "$notes" ] && [ ! -L "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "UDM $TAG" \
            "$@"
