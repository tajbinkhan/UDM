# Builds UDM and runs its tests on Windows, macOS and Linux for every pull
# request and every push to main. Other branches are built once they have a
# pull request, so a push to a PR branch runs the matrix once, not twice.
# Nothing is stored: the installers are made by release.yml, which attaches
# them to a GitHub Release.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-15
          - name: Linux
            os: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev libxkbcommon-x11-0 libayatana-appindicator3-1

      # rustfmt.toml holds the settings. Run cargo fmt before committing.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --locked

      # Each runner checks its own platform's code, so a warning in a
      # Windows-only or Linux-only block fails only there.
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the extension
        run: node --test extension/test/*.test.js

      # The Firefox copy is made from extension/, not kept in git, so a copy
      # made before a change lacks it (#149). This makes it as the macOS and
      # Linux packages do and checks the copy against the extension, which
      # proves the maker and the check agree.
      - name: Check the Firefox copy
        shell: bash
        run: |
          node installer/make-firefox.js "$RUNNER_TEMP/firefox-node"
          node installer/make-firefox.js --check "$RUNNER_TEMP/firefox-node"

      # Setup, the portable zip and install-host.ps1 make it with
      # make-firefox.ps1 instead, in PowerShell 7 and Windows PowerShell 5.1:
      # each must make the same copy as make-firefox.js, and its own check
      # must agree.
      - name: Check the Windows Firefox copy (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\installer\make-firefox.ps1 -Out "$env:RUNNER_TEMP\firefox-pwsh"
          node installer/make-firefox.js --check "$env:RUNNER_TEMP\firefox-pwsh"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\installer\make-firefox.ps1 -Check "$env:RUNNER_TEMP\firefox-pwsh"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\installer\make-firefox.ps1 -Check "$env:RUNNER_TEMP\firefox-node"

      - name: Check the Windows Firefox copy (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\installer\make-firefox.ps1 -Out "$env:RUNNER_TEMP\firefox-powershell"
          node installer/make-firefox.js --check "$env:RUNNER_TEMP\firefox-powershell"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\installer\make-firefox.ps1 -Check "$env:RUNNER_TEMP\firefox-powershell"
