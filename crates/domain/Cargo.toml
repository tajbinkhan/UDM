[package]
name = "uidm-domain"
description = "UIDM's entities, value objects, business rules and port traits"
version.workspace = true
edition.workspace = true
license.workspace = true

# Pure crates only (AGENTS.md section 3): no I/O, async runtime or UI crate.
[dependencies]
serde = { workspace = true }
# Error enums (AGENTS.md section 9).
thiserror.workspace = true
# Parsing addresses only (batch patterns); no requests.
url.workspace = true
# Decoding %-escapes in the file names the site grabber finds; pure, from
# the same family as url.
percent-encoding.workspace = true

[dev-dependencies]
serde_json.workspace = true

# The workspace's lints: no unwrap, expect or panic outside tests.
[lints]
workspace = true
