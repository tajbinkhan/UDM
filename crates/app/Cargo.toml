[package]
name = "pullbay-app"
description = "Pullbay's binaries: native-messaging host, persistent daemon, desktop window, command-line tool and AI assistants' server"
version.workspace = true
edition.workspace = true
license.workspace = true

# The browser launches this; it relays to the daemon (and has a CLI test mode).
[[bin]]
name = "pullbay-host"
path = "src/bin/pullbay-host.rs"

# Long-lived process that owns the engine so downloads outlive the browser.
[[bin]]
name = "pullbay-daemon"
path = "src/bin/pullbay-daemon.rs"

# Desktop window that lists and controls downloads; another daemon client.
# Its views are in pullbay-ui; this binary wires them to the adapters.
[[bin]]
name = "pullbay-gui"
path = "src/bin/pullbay-gui.rs"

# The command-line tool: downloads and controls Pullbay from a terminal or a
# script, through the daemon like the window. (`pullbay` itself is the
# window's name on Linux, so the tool has its own.)
[[bin]]
name = "pullbay-cli"
path = "src/bin/pullbay-cli.rs"

# The Model Context Protocol server AI assistants start, which lists and
# controls downloads through the daemon like the window.
[[bin]]
name = "pullbay-mcp"
path = "src/bin/pullbay-mcp.rs"

[dependencies]
pullbay-domain.workspace = true
pullbay-application.workspace = true
pullbay-infrastructure.workspace = true
pullbay-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
# The binaries' log events; `pullbay_infrastructure::logging` writes them.
tracing.workspace = true
# Startup errors, with what each step was doing (AGENTS.md section 9).
anyhow.workspace = true
# The window's run result, which `pullbay-gui`'s main returns.
eframe = "0.31.1"

# The workspace's lints: no unwrap, expect or panic outside tests.
[lints]
workspace = true
