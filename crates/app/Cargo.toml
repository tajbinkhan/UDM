[package]
name = "udm-app"
description = "UDM's binaries: native-messaging host, persistent daemon, desktop window, command-line tool and AI assistants' server"
version.workspace = true
edition.workspace = true
license.workspace = true

# The browser launches this; it relays to the daemon (and has a CLI test mode).
[[bin]]
name = "udm-host"
path = "src/bin/udm-host.rs"

# Long-lived process that owns the engine so downloads outlive the browser.
[[bin]]
name = "udm-daemon"
path = "src/bin/udm-daemon.rs"

# Desktop window that lists and controls downloads; another daemon client.
# Its views are in udm-ui; this binary wires them to the adapters.
[[bin]]
name = "udm-gui"
path = "src/bin/udm-gui.rs"

# The Tauri window (ADR 0002), built beside udm-gui until it does everything
# the egui window does (AGENTS.md section 16). Its shell is udm-ui-tauri.
[[bin]]
name = "udm-gui-next"
path = "src/bin/udm-gui-next.rs"
required-features = ["tauri-window"]

# The command-line tool: downloads and controls UDM from a terminal or a
# script, through the daemon like the window. (`udm` itself is the
# window's name on Linux, so the tool has its own.)
[[bin]]
name = "udm-cli"
path = "src/bin/udm-cli.rs"

# The Model Context Protocol server AI assistants start, which lists and
# controls downloads through the daemon like the window.
[[bin]]
name = "udm-mcp"
path = "src/bin/udm-mcp.rs"

[features]
default = ["tauri-window", "embed-frontend"]
# The Tauri window, udm-gui-next. On Linux it needs WebKitGTK.
tauri-window = ["dep:udm-ui-tauri"]
# Build the frontend into it (`pnpm --dir frontend build` first). Without
# this it loads Vite's dev server, for working on the frontend.
embed-frontend = ["tauri-window", "udm-ui-tauri/embed"]

[dependencies]
udm-domain.workspace = true
udm-application.workspace = true
udm-infrastructure.workspace = true
udm-ui.workspace = true
# Optional so the server image (Dockerfile) builds without a webview.
udm-ui-tauri = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
# The binaries' log events; `udm_infrastructure::logging` writes them.
tracing.workspace = true
# Startup errors, with what each step was doing (AGENTS.md section 9).
anyhow.workspace = true
# The window's run result, which `udm-gui`'s main returns.
eframe = "0.31.1"

# The workspace's lints: no unwrap, expect or panic outside tests.
[lints]
workspace = true
